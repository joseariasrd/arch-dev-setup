# Hyprland — managed by arch-dev-setup. Session env vars live in ~/.config/uwsm/env.
# Docs: https://wiki.hypr.land

# ── Monitors ─────────────────────────────────────────────
# Run `hyprctl monitors` and pin resolution/refresh here, e.g.:
# monitor = DP-1, 2560x1440@165, 0x0, 1
monitor = , preferred, auto, 1

# ── Programs ─────────────────────────────────────────────
$terminal = kitty
$launcher = fuzzel
$files    = thunar
$browser  = google-chrome-stable
$editor   = code

# ── Autostart (uwsm app → each app runs as its own systemd unit) ──
exec-once = uwsm app -- waybar
exec-once = uwsm app -- mako
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- nm-applet --indicator
exec-once = uwsm app -- blueman-applet
exec-once = systemctl --user start hyprpolkitagent
exec-once = uwsm app -- wl-paste --watch cliphist store

# ── Input ────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    repeat_rate = 40
    repeat_delay = 300
}

# ── Look & feel ──────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(89b4fa) rgb(cba6f7) 45deg
    col.inactive_border = rgb(313244)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 4
        passes = 2
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 3, ease, popin 85%
    animation = fade, 1, 3, ease
    animation = workspaces, 1, 3, ease, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(1e1e2e)
}

# ── Keybindings ──────────────────────────────────────────
$mod = SUPER

bind = $mod, Return, exec, uwsm app -- $terminal
bind = $mod, D, exec, $launcher --launch-prefix="uwsm app -- "
bind = $mod, E, exec, uwsm app -- $files
bind = $mod, B, exec, uwsm app -- $browser
bind = $mod, C, exec, uwsm app -- $editor

# System assistant: floating terminal running Claude Code inside ~/dotfiles
bind = $mod, A, exec, [float; size 1100 750; center] uwsm app -- kitty --class claude-assistant -d $HOME/dotfiles claude

bind = $mod, Q, killactive
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, P, pseudo
bind = $mod, T, togglesplit
bind = $mod, Escape, exec, hyprlock
bind = $mod SHIFT, Escape, exec, uwsm stop

# Clipboard history & screenshots
bind = $mod SHIFT, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# Focus / move windows (arrows and vim keys)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, S, togglespecialworkspace, scratch
bind = $mod SHIFT, S, movetoworkspace, special:scratch
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Mouse: move / resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Machine-specific overrides (not tracked): ~/.config/hypr/local.conf
source = ~/.config/hypr/local.conf
