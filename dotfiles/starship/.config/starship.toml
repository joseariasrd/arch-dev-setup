# Minimal prompt
add_newline = false
format = "$directory$git_branch$git_status$nodejs$python$docker_context$cmd_duration$line_break$character"

[directory]
truncation_length = 3
style = "bold cyan"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "

[cmd_duration]
min_time = 2000

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
